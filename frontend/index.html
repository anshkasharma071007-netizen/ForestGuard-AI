<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Forest Guard AI — AI-assisted wildlife monitoring, geospatial risk mapping and human–wildlife conflict prevention."
    />
    <script>
      try {
        if (localStorage.getItem('fga.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch {
        // Storage may be unavailable. Use the default light theme.
      }
    </script>
    <style>
      :root[data-theme='dark'] {
        color-scheme: dark;
        --theme-canvas: #171f1b;
        background: var(--theme-canvas);
      }
    </style>
    <title>Forest Guard AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
